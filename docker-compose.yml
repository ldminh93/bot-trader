services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: futures_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futures_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8080"
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # celery beat's default PersistentScheduler tracks each periodic task's
    # last-run time in a local file. Without a volume, that file lives on the
    # container's writable layer and is wiped on every recreate (redeploy),
    # which resets every task's countdown from zero — a task on a 24h
    # interval (cleanup-old-snapshots) then needs 24h of uninterrupted
    # uptime to ever fire once, and never does if redeploys happen more
    # often than that.
    command: celery -A config beat -l info --schedule=/app/celerybeat-data/celerybeat-schedule
    env_file: .env
    restart: unless-stopped
    volumes:
      - celerybeat_data:/app/celerybeat-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
      PORT: ${PORT:-3333}
    ports:
      - "3333:3333"
    depends_on:
      - backend

volumes:
  postgres_data:
  celerybeat_data:
